  <title>JC History Revision Game</title>
  <style>
    /* Comic Sans throughout */
    :root{
      --bg0: #07090f;
      --bg1: #0d1020;
      --stroke: rgba(255,255,255,.1);
      --stroke2: rgba(255,255,255,.06);
      --text: #f0f4ff;
      --muted: #b0bcdc;
      --a1: #f0b429;   /* gold/amber */
      --a2: #3d5afe;
      --warm: #ffb347;
      --green: #f0b429;
      --red: #ff5370;
      --shadow: 0 32px 80px rgba(0,0,0,.7);
      --radius: 22px;
      --font-display: 'Comic Sans MS', 'Comic Sans', cursive;
      --font-body: 'Comic Sans MS', 'Comic Sans', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg0);
      background-image:
        radial-gradient(ellipse 900px 500px at 80% 0%, rgba(61,90,254,.22), transparent 60%),
        radial-gradient(ellipse 600px 400px at 10% 90%, rgba(240,180,41,.05), transparent 55%);
      padding: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

      border: 1px solid var(--stroke2);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .brand h1 {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700; font-style: italic;
      color: var(--text); letter-spacing: -0.01em;
    }
    .brand h1 span { color: var(--a1); font-style: normal; }

    #topicChip {
      font-size: 11px; color: var(--a1); font-weight: 700;
      background: rgba(240,180,41,0.08); border: 1px solid rgba(240,180,41,0.2);
      padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* ── MAIN PANEL ── */
    .panel {
      background: linear-gradient(160deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.03) 100%);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      flex-grow: 1; min-height: 0;
      display: flex; flex-direction: column;
    }

    .inner { padding: 22px; overflow-y: auto; height: 100%; }

    /* ── PROGRESS BAR ── */
    .pbar {
      height: 4px; background: rgba(255,255,255,0.06);
      border-radius: 4px; overflow: hidden;
      display: none; margin-bottom: 22px;
    }
    .pbar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #f0b429, var(--a2));
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(240,180,41,0.5);
    }

    /* ── TIMER RING ── */
    .timer-ring { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring circle { fill: none; stroke-width: 3.5; }
    .timer-ring .bg { stroke: rgba(255,255,255,0.08); }
    .timer-ring .fg {
      stroke: var(--a1); stroke-linecap: round;
      stroke-dasharray: 138; stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
    }
    .timer-ring .label {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: var(--a1);
      font-family: var(--font-body);
      transition: color 0.4s;
    }

    /* ── START SCREEN ── */
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(26px, 5vw, 36px); font-weight: 700; font-style: italic;
      line-height: 1.1; margin-bottom: 4px;
    }
    .hero-sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

    /* Chapter cards */
    .chapter-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .chapter-card {
      padding: 14px 16px; border-radius: 16px; cursor: pointer;
      border: 1.5px solid var(--stroke2);
      background: rgba(255,255,255,0.04);
      transition: all 0.2s; text-align: left;
      position: relative; overflow: hidden;
    }
    .chapter-card::before {
      content: ''; position: absolute; inset: 0; opacity: 0;
      background: linear-gradient(135deg, rgba(240,180,41,0.08), rgba(61,90,254,0.08));
      transition: opacity 0.2s;
    }
    .chapter-card:hover::before { opacity: 1; }
    .chapter-card:hover { border-color: rgba(240,180,41,0.3); transform: translateY(-1px); }
    .chapter-card.active {
      border-color: var(--a1);
      background: rgba(240,180,41,0.07);
      box-shadow: 0 0 0 3px rgba(240,180,41,0.1);
    }
    .chapter-card .cc-icon { font-size: 22px; margin-bottom: 6px; }
    .chapter-card .cc-name { font-weight: 700; font-size: 13px; line-height: 1.3; }
    .chapter-card .cc-count { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .chapter-card .cc-lock {
      position: absolute; top: 10px; right: 10px;
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    }
    .cc-lock.locked { background: rgba(255,83,112,0.15); color: var(--red); border: 1px solid rgba(255,83,112,0.3); }
    .cc-lock.open   { background: rgba(240,180,41,0.1);  color: var(--a1);  border: 1px solid rgba(240,180,41,0.2); }

    /* Form */
    .formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    label { font-size: 10px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.08em; }

    input, select {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 2px solid rgba(240,180,41,0.5);
      background: rgba(0, 0, 0, 0.65);
      color: #f0f4ff; font-size: 14px; outline: none; appearance: none;
      font-family: var(--font-body); transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 0 transparent;
    }
    input:focus, select:focus {
      border-color: var(--a1);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4), 0 0 0 3px rgba(240,180,41,0.2), 0 0 12px rgba(240,180,41,0.15);
    }
    input:hover:not(:disabled):not(:focus), select:hover:not(:disabled):not(:focus) {
      border-color: rgba(240,180,41,0.7);
    }
    input:disabled {
      background: rgba(0,0,0,0.35);
      border-color: rgba(240,180,41,0.18);
      opacity: 1;
      color: var(--muted);
      cursor: default;
    }
    /* Prevent browsers from overriding autofill background */
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 100px #050808 inset;
      -webkit-text-fill-color: #f0f4ff;
    }
    select option {
      background: #0a0d18;
      color: #f0f4ff;
    }
    /* Label styling */
    label {
      display: flex; align-items: center; gap: 5px;
    }
    label::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--a1); opacity: 0.7; flex-shrink: 0;
    }

    .selectWrap { position: relative; }
    .selectWrap::after {
      content: "▾"; position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%); color: var(--a1); font-weight: 900; pointer-events: none; font-size: 12px;
    }

    /* Mode box */
    .mode-box {
      background: rgba(255,255,255,0.04); padding: 13px 15px; border-radius: 14px;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--stroke2); gap: 12px;
    }
    .mode-box.locked { opacity: 0.35; pointer-events: none; }
    .mode-box strong { font-size: 14px; }
    .mode-box small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; border-radius: 24px;
      background: rgba(255,255,255,0.1); border: 1px solid var(--stroke);
      cursor: pointer; transition: background 0.25s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 2px; top: 2px; border-radius: 50%;
      background: var(--muted); transition: transform 0.25s, background 0.25s;
    }
    .toggle input:checked + .toggle-slider { background: rgba(240,180,41,0.2); border-color: var(--a1); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); background: var(--a1); }

    /* Buttons */
    .btn {
      padding: 14px 20px; border-radius: 14px; font-weight: 700; font-size: 16px;
      border: 0; cursor: pointer; width: 100%;
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
      font-family: var(--font-body); letter-spacing: -0.01em;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(135deg, #f0b429 0%, #f5c842 50%, var(--a2) 100%);
      background-size: 200% 100%; background-position: 0% 0%;
      color: #fff; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      box-shadow: 0 4px 24px rgba(240,140,20,0.35);
      transition: background-position 0.4s, transform 0.12s, box-shadow 0.2s;
    }
    .btn.primary:hover:not(:disabled) {
      background-position: 100% 0%;
      box-shadow: 0 6px 30px rgba(240,180,41,0.4);
    }
    .btn.secondary {
      background: rgba(255,255,255,0.07); color: var(--text);
      border: 1px solid var(--stroke); margin-top: 8px; font-size: 14px;
    }
    .btn.secondary:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Warning banner */
    .warning-banner {
      background: rgba(255,83,112,0.1); border: 1px solid rgba(255,83,112,0.3);
      border-radius: 10px; padding: 9px 13px; font-size: 12px; color: #ff8fa3;
      margin-bottom: 12px; display: none;
    }

    /* ── QUESTION SCREEN ── */
    .q-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; gap: 10px;
    }
    .q-meta {
      display: flex; flex-direction: column; gap: 4px; flex: 1;
    }
    .q-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .q-mode-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .q-mode-badge.practice { background: rgba(255,179,71,0.12); color: var(--warm); border: 1px solid rgba(255,179,71,0.25); }
    .q-mode-badge.final    { background: rgba(240,180,41,0.1);   color: var(--a1);  border: 1px solid rgba(240,180,41,0.2); }

    .streak-badge {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 800;
      padding: 5px 11px; border-radius: 20px;
    }
    .streak-badge.hot {
      background: linear-gradient(135deg, rgba(255,179,71,0.2), rgba(255,83,112,0.2));
      border: 1px solid rgba(255,179,71,0.4); color: var(--warm);
      animation: streakPulse 1s infinite alternate;
    }
    @keyframes streakPulse { from { box-shadow: 0 0 0 0 rgba(255,179,71,0.3); } to { box-shadow: 0 0 12px 2px rgba(255,179,71,0.2); } }

    .question-text {
      font-family: var(--font-display);
      font-size: clamp(17px, 3vw, 22px); font-weight: 300;
      line-height: 1.45; margin-bottom: 20px; color: var(--text);
      letter-spacing: -0.01em;
    }

    /* Answer options with letter labels */
    .opt {
      width: 100%; text-align: left; padding: 0; border-radius: 13px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--stroke2);
      color: var(--text); margin-bottom: 8px; cursor: pointer;
      transition: all 0.18s; font-family: var(--font-body);
      display: flex; align-items: stretch; overflow: hidden;
    }
    .opt:hover:not(:disabled) {
      background: rgba(255,255,255,0.08); border-color: rgba(240,180,41,0.6);
      transform: translateX(3px);
    }
    .opt-letter {
      width: 42px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; letter-spacing: 0.05em;
      background: rgba(255,255,255,0.05); border-right: 1px solid var(--stroke2);
      color: var(--muted); transition: all 0.18s;
    }
    .opt-text {
      padding: 13px 14px; font-size: 14px; line-height: 1.4; flex: 1;
    }
    .opt.correct { background: rgba(240,180,41,0.12); border-color: var(--a1); }
    .opt.correct .opt-letter { background: rgba(240,180,41,0.25); color: var(--a1); border-color: rgba(240,180,41,0.4); }
    .opt.correct .opt-text { color: var(--a1); font-weight: 600; }
    .opt.wrong   { background: rgba(255,83,112,0.1); border-color: var(--red); }
    .opt.wrong   .opt-letter { background: rgba(255,83,112,0.2); color: var(--red); border-color: rgba(255,83,112,0.3); }
    .opt.wrong   .opt-text { color: var(--red); }
    .opt:disabled { cursor: default; transform: none; }

    /* Options/Feedback crossfade */
    #opts {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #opts.fading-out {
      opacity: 0; transform: translateY(-6px); pointer-events: none;
    }

    /* Feedback replaces options in same space */
    .feedback-box {
      display: none; padding: 14px 16px;
      background: rgba(255,255,255,0.04); border-radius: 14px;
      border: 1px solid var(--stroke2);
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.25s ease 0.2s, transform 0.25s ease 0.2s;
    }
    .feedback-box.visible { opacity: 1; transform: translateY(0); }
    .feedback-box .fb-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; }
    .feedback-box .fb-exp { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }

    /* ── RESULTS ── */
    .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .result-card {
      background: rgba(255,255,255,0.05); border: 1px solid var(--stroke2);
      border-radius: 14px; padding: 14px 10px; text-align: center;
    }
    .result-card .val {
      font-family: var(--font-display); font-size: 28px; font-weight: 700;
      color: var(--a1); line-height: 1;
    }
    .result-card .lbl { font-size: 10px; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* Review */
    .review-list { margin-top: 10px; }
    .review-item {
      background: rgba(255,255,255,0.03); border-radius: 11px;
      padding: 11px 13px; margin-bottom: 7px;
      border-left: 3px solid var(--red);
    }
    .review-item .rq { font-size: 13px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; }
    .review-item .ra { font-size: 12px; color: var(--muted); }
    .review-item .rexp { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; opacity: 0.8; }

    /* Submit status */
    .submit-status { font-size: 12px; padding: 8px 12px; border-radius: 9px; text-align: center; margin-top: 8px; }
    .submit-status.sending { background: rgba(61,90,254,0.1);  color: #818cf8; }
    .submit-status.sent    { background: rgba(240,180,41,0.1); color: var(--green); }
    .submit-status.failed  { background: rgba(255,83,112,0.1); color: var(--red); }

    /* Overlay */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(8px); padding: 20px;
    }
    .overlay-box {
      background: var(--bg1); border: 1px solid var(--stroke);
      border-radius: 20px; padding: 28px; max-width: 360px; width: 100%;
      text-align: center; box-shadow: var(--shadow);
    }
    .overlay-box h3 { font-family: var(--font-display); font-size: 22px; font-style: italic; margin-bottom: 10px; }
    .overlay-box p  { color: var(--muted); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
    .overlay-btns   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Details/summary */
    details { margin-top: 10px; }
    details summary {
      cursor: pointer; color: var(--a1); font-size: 13px; font-weight: 700;
      padding: 9px 13px; border-radius: 10px; list-style: none;
      background: rgba(240,180,41,0.06); border: 1px solid rgba(240,180,41,0.15);
      transition: background 0.2s;
    }
    details summary:hover { background: rgba(240,180,41,0.1); }
    details summary::-webkit-details-marker { display: none; }
    details[open] summary { margin-bottom: 8px; border-radius: 10px 10px 4px 4px; }

    /* ── MOBILE ── */
    @media (max-width: 540px) {
      body { padding: 8px; }
      .inner { padding: 14px; }
      .chapter-cards { grid-template-columns: 1fr; }
      .formrow { grid-template-columns: 1fr; }
      .results-grid { grid-template-columns: 1fr 1fr; }
      .overlay-btns { grid-template-columns: 1fr; }
      .hero-title { font-size: 24px; }
      .question-text { font-size: 16px; }
      .opt-text { font-size: 13px; padding: 11px 12px; }
      .opt-letter { width: 36px; font-size: 11px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <div class="brand"><h1>JC <span>History</span> Revision</h1></div>
    <div id="topicChip">Loading...</div>
  </div>
  <div class="panel">
    <div class="inner">
      <div class="pbar" id="pBar"><div id="pFill"></div></div>
      <div id="screen"></div>
    </div>
  </div>
</div>

<script>
/* ─────────────── CONFIG ─────────────── */
const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzIja5pFc9cS0wYK8zxQppDyprP7o-lDNv6XDns6AO7extfY4UDVv72Yxz75QwC8vBE/exec";
const TOTAL_QUESTIONS = 25;
const SECONDS_PER_Q  = 20;

/* ─────────────── QUESTION BANKS (loaded from questions.json) ─────────────── */
let CHAPTERS = {};

async function loadQuestions() {
  try {
    const res = await fetch('questions.json');
    if (!res.ok) throw new Error('Could not load questions.json');
    CHAPTERS = await res.json();
    // Set default chapter key once loaded
    state.chapterKey = Object.keys(CHAPTERS)[0];
    showStart();
  } catch(err) {
    document.getElementById("screen").innerHTML = `
      <div style="text-align:center; padding: 40px 20px;">
        <div style="font-size:48px; margin-bottom:16px;">⚠️</div>
        <h2 style="font-family:var(--font-display); margin-bottom:10px;">Questions failed to load</h2>
        <p style="color:var(--muted); font-size:14px;">Make sure <strong>questions.json</strong> is in the same folder as this file and that you are viewing this via GitHub Pages, not opening the file directly.</p>
        <p style="color:var(--red); font-size:12px; margin-top:10px;">${err.message}</p>
      </div>`;
  }
}

/* ─────────────── STATE ─────────────── */
function freshState() {
  return {
    idx: 0, score: 0, correct: 0, streak: 0,
    questions: [], answers: [],
    timer: null, timeLeft: SECONDS_PER_Q,
    studentName: "", studentClass: "",
    chapterKey: "",   // set after questions.json loads
    isPractice: false
  };
}
let state = freshState();



/* ─────────────── SCREENS ─────────────── */
function showStart() {
  const hasSubmitted = localStorage.getItem("submitted_" + state.chapterKey);
  const hasPracticed = localStorage.getItem("practiced_" + state.chapterKey);
  const chapter = CHAPTERS[state.chapterKey];
  const qCount = chapter.questions.length;
  const actualQ = Math.min(qCount, TOTAL_QUESTIONS);
  const shortBank = qCount < TOTAL_QUESTIONS;

  document.getElementById("pBar").style.display = "none";
  document.getElementById("topicChip").textContent = state.chapterKey;

  if (hasPracticed) state.isPractice = false;

  document.getElementById("screen").innerHTML = `
    <p class="hero-title">JC History Quiz</p>
    <p class="hero-sub">Select your chapter, enter your details, and begin.</p>

    <div class="formrow" style="margin-bottom:4px;">
      <div>
        <label>Chapter</label>
        <div class="selectWrap">
          <select id="chapterSelect" onchange="state.chapterKey=this.value; showStart();">
            ${Object.entries(CHAPTERS).map(([k, v]) => {
              const submitted = localStorage.getItem("submitted_" + k);
              return `<option value="${k}" ${k === state.chapterKey ? 'selected' : ''}>${submitted ? '🔒 ' : ''}${k}</option>`;
            }).join("")}
          </select>
        </div>
      </div>
      <div>
        <label>Attempt Status</label>
        <input value="${hasSubmitted ? '🔒 Locked — score recorded' : `✅ Available · ${actualQ} questions`}" disabled
               style="color:${hasSubmitted ? 'var(--red)' : 'var(--green)'}; font-weight:700; font-size:13px;">
      </div>
    </div>

    <div class="warning-banner" id="shortWarn" style="${shortBank ? 'display:block' : ''}">
      ⚠️ This chapter only has ${qCount} questions — quiz will use all ${qCount} (not ${TOTAL_QUESTIONS}).
    </div>

    <div class="mode-box ${hasPracticed ? 'locked' : ''}">
      <div>
        <strong>Practice Mode</strong>
        <small>${hasPracticed ? '🚫 Already used your 1 practice round' : 'One free attempt before your graded submission'}</small>
      </div>
      <label class="toggle">
        <input type="checkbox" id="practiceMode" ${state.isPractice ? 'checked' : ''} ${hasPracticed ? 'disabled' : ''} onchange="state.isPractice = this.checked">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="formrow">
      <div><label>Your Name</label><input id="sName" placeholder="First name..." value="${state.studentName}"></div>
      <div><label>Class</label>
        <div class="selectWrap">
          <select id="sClass">
            <option value="">Select class...</option>
            ${["1A","1B","1C","2A","2B","2C"3A","3B","3C"].map(c=>`<option value="${c}" ${c===state.studentClass?'selected':''}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
    </div>

    <button class="btn primary" id="startBtn" onclick="confirmStart()" ${hasSubmitted ? 'disabled' : ''} style="margin-top:10px;">
      ${hasSubmitted ? '✓ Final Score Already Recorded' : '▶ Begin Quiz'}
    </button>
  `;
}

function confirmStart() {
  // Trim whitespace and convert to title case (e.g. "john murphy" → "John Murphy")
  const rawName = document.getElementById("sName").value.trim();
  const n = rawName
    .toLowerCase()
    .split(' ')
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(' ');
  const c = document.getElementById("sClass").value;
  if (!n || !c) return alert("Please enter your name and select a class!");

  // Persist name/class so re-renders don't clear them
  state.studentName = n;
  state.studentClass = c;

  if (state.isPractice) {
    startGame();
    return;
  }

  // Show confirmation before locking a final attempt
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="overlay-box">
      <h3>Final Attempt</h3>
      <p>You're about to start your <strong>final, graded attempt</strong> for <em>${state.chapterKey}</em>.<br><br>
         Once you begin you cannot restart. Are you ready?</p>
      <div class="overlay-btns">
        <button class="btn secondary" style="margin:0" onclick="this.closest('.overlay').remove()">Cancel</button>
        <button class="btn primary" style="margin:0; font-size:16px" onclick="this.closest('.overlay').remove(); startGame();">Let's go!</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function startGame() {
  const chapter = CHAPTERS[state.chapterKey];
  state.idx = 0; state.score = 0; state.correct = 0; state.streak = 0; state.answers = [];
  state.questions = [...chapter.questions]
    .sort(() => Math.random() - 0.5)
    .slice(0, TOTAL_QUESTIONS);
  document.getElementById("pBar").style.display = "block";
  showQuestion();
}

function showQuestion() {
  clearInterval(state.timer);
  state.timeLeft = SECONDS_PER_Q;

  const q = state.questions[state.idx];
  const progress = state.idx / state.questions.length;
  document.getElementById("pFill").style.width = (progress * 100) + "%";

  const circumference = 2 * Math.PI * 22; // r=22
  const LETTERS = ["A","B","C","D"];

  document.getElementById("screen").innerHTML = `
    <div class="q-header">
      <div class="q-meta">
        <span class="q-label">Question ${state.idx + 1} of ${state.questions.length}</span>
        <span class="q-mode-badge ${state.isPractice ? 'practice' : 'final'}">
          ${state.isPractice ? '🛠 Practice' : '🏆 Final Attempt'}
        </span>
      </div>
      <div id="streakBadge" class="streak-badge ${state.streak >= 3 ? 'hot' : ''}" style="${state.streak === 0 ? 'visibility:hidden' : ''}">
        🔥 ${state.streak}
      </div>
      <div class="timer-ring">
        <svg width="54" height="54" viewBox="0 0 54 54">
          <circle class="bg" cx="27" cy="27" r="22"/>
          <circle class="fg" id="timerRing" cx="27" cy="27" r="22" stroke-dasharray="${circumference}" stroke-dashoffset="0"/>
        </svg>
        <div class="label" id="timerDisp">${state.timeLeft}</div>
      </div>
    </div>

    <div class="question-text">${q.q}</div>

    <div id="opts">
      ${q.options.map((o, i) => `
        <button class="opt" data-idx="${i}">
          <span class="opt-letter">${LETTERS[i]}</span>
          <span class="opt-text">${o}</span>
        </button>`).join("")}
    </div>

    <div class="feedback-box" id="fb">
      <div class="fb-title" id="fbTitle"></div>
      <div class="fb-exp">${q.explanation}</div>
      <button class="btn primary" onclick="nextQuestion()">Continue →</button>
    </div>
  `;

  document.getElementById("opts").addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (btn) checkAnswer(parseInt(btn.dataset.idx, 10));
  });

  startTimer();
}

function startTimer() {
  const circumference = 2 * Math.PI * 22;
  state.timer = setInterval(() => {
    state.timeLeft--;
    const timerDisp = document.getElementById("timerDisp");
    const timerRing = document.getElementById("timerRing");
    if (!timerDisp) { clearInterval(state.timer); return; }

    timerDisp.textContent = state.timeLeft;
    const fraction = state.timeLeft / SECONDS_PER_Q;
    timerRing.style.strokeDashoffset = circumference * (1 - fraction);
    timerRing.style.stroke = fraction > 0.4 ? "var(--a1)" : fraction > 0.2 ? "var(--warm)" : "var(--red)";
    timerDisp.style.color = fraction > 0.4 ? "var(--a1)" : fraction > 0.2 ? "var(--warm)" : "var(--red)";

    if (state.timeLeft <= 0) checkAnswer(-1);
  }, 1000);
}

function checkAnswer(choice) {
  clearInterval(state.timer);
  const q = state.questions[state.idx];
  const isCorrect = (choice === q.answerIndex);

  if (isCorrect) {
    state.correct++;
    state.streak++;
    state.score += 100 + (state.timeLeft * 5);
  } else {
    state.streak = 0;
  }

  state.answers.push({ q: q.q, chosen: choice, correct: q.answerIndex, explanation: q.explanation, options: q.options });

  // Colour the buttons
  const opts = document.querySelectorAll(".opt");
  opts.forEach(btn => {
    btn.disabled = true;
    const i = parseInt(btn.dataset.idx, 10);
    if (i === q.answerIndex) btn.classList.add("correct");
    else if (i === choice)   btn.classList.add("wrong");
  });

  const fbTitle = isCorrect
    ? "✅ Correct!"
    : choice === -1
      ? "⏱ Time's up! The correct answer was: " + q.options[q.answerIndex]
      : "❌ Wrong — the correct answer was: " + q.options[q.answerIndex];

  document.getElementById("fbTitle").innerHTML = fbTitle;

  // Crossfade: fade options out, then show feedback in their place
  const optsEl = document.getElementById("opts");
  const fbEl   = document.getElementById("fb");

  optsEl.classList.add("fading-out");

  setTimeout(() => {
    optsEl.style.display = "none";
    fbEl.style.display = "block";
    // Force reflow so transition fires
    fbEl.getBoundingClientRect();
    fbEl.classList.add("visible");
  }, 250);
}

function nextQuestion() {
  state.idx++;
  if (state.idx >= state.questions.length) return finishGame();
  showQuestion();
}

async function finishGame() {
  if (state.isPractice) {
    localStorage.setItem("practiced_" + state.chapterKey, "true");
  } else {
    localStorage.setItem("submitted_" + state.chapterKey, "true");
  }

  const pct = Math.round((state.correct / state.questions.length) * 100);
  const wrongItems = state.answers.filter(a => a.chosen !== a.correct);

  document.getElementById("screen").innerHTML = `
    <h2 style="font-family:var(--font-display); font-size:26px; font-weight:700; font-style:italic; margin-bottom:14px;">
      ${state.isPractice ? '🛠 Practice Complete!' : '🎉 Quiz Finished!'}
    </h2>

    <div class="results-grid">
      <div class="result-card">
        <div class="val">${state.score.toLocaleString()}</div>
        <div class="lbl">Points</div>
      </div>
      <div class="result-card">
        <div class="val">${state.correct}/${state.questions.length}</div>
        <div class="lbl">Correct</div>
      </div>
      <div class="result-card">
        <div class="val">${pct}%</div>
        <div class="lbl">Accuracy</div>
      </div>
      <div class="result-card">
        <div class="val" style="color:${state.streak >= 3 ? '#f59e0b' : 'var(--a1)'}">${state.streak}🔥</div>
        <div class="lbl">Final Streak</div>
      </div>
    </div>

    <p style="color:var(--muted); font-size:14px; margin-bottom:8px;">
      ${state.isPractice
        ? 'Practice complete. You may now attempt the final graded version.'
        : 'Your score has been submitted to the teacher.'}
    </p>

    ${wrongItems.length > 0 ? `
    <details>
      <summary>📖 Review ${wrongItems.length} missed question${wrongItems.length>1?'s':''}</summary>
      <div class="review-list">
        ${wrongItems.map(a => `
          <div class="review-item wrong-item">
            <div class="rq">${a.q}</div>
            <div class="ra">✅ Correct: <strong>${a.options[a.correct]}</strong>${a.chosen >= 0 ? ` &nbsp;·&nbsp; ❌ You chose: ${a.options[a.chosen]}` : ' &nbsp;·&nbsp; ⏱ Timed out'}</div>
            <div class="rexp">${a.explanation}</div>
          </div>
        `).join("")}
      </div>
    </details>` : '<p style="color:var(--green); font-weight:700; font-size:14px;">🎯 Perfect score — no mistakes!</p>'}

    <div id="submitStatus"></div>
    <button class="btn secondary" onclick="showStart()">← Return to Menu</button>
  `;

  if (!state.isPractice) {
    const statusEl = document.getElementById("submitStatus");
    statusEl.className = "submit-status sending";
    statusEl.textContent = "⏳ Submitting score…";

    const payload = new URLSearchParams({
      StudentName: state.studentName,
      Class: state.studentClass,
      Chapter: state.chapterKey,
      Score: state.score,
      Correct: `${state.correct}/${state.questions.length}`,
      Accuracy: pct + "%"
    });

    try {
      await fetch(GOOGLE_URL, { method: "POST", mode: "no-cors", body: payload });
      statusEl.className = "submit-status sent";
      statusEl.textContent = "✅ Score submitted successfully.";
    } catch (err) {
      statusEl.className = "submit-status failed";
      statusEl.textContent = "⚠️ Submission failed — please tell your teacher manually.";
      console.error("Score submission failed:", err);
    }
  }
}

/* ─────────────── INIT ─────────────── */
loadQuestions();
</script>
</body>
</html>
